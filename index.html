const menuSig=()=>{let s=st+'|'+XR.tab+'|'+$('t').textContent+'|'+$('m').textContent+'|'+$('big').textContent+'|'+$('modes').className+'|'+$('go').textContent+'|'+XR.board.scale+'|'+camp+'|'+sk+'|'+cl+'|'+mode;

function billboard(pos,head,tilt){return m4.mul(m4.mul(m4.T(pos[0],pos[1],pos[2]),m4.Ry(Math.atan2(head[0]-pos[0],head[2]-pos[2]))),m4.Rx(tilt))}
function hit(o,d,p){const M=p.M,nx=M[8],ny=M[9],nz=M[10],den=d[0]*nx+d[1]*ny+d[2]*nz;if(Math.abs(den)<1e-5)return null;
 const t=((M[12]-o[0])*nx+(M[13]-o[1])*ny+(M[14]-o[2])*nz)/den;if(t<0||t>6)return null;
 const hx=o[0]+d[0]*t-M[12],hy=o[1]+d[1]*t-M[13],hz=o[2]+d[2]*t-M[14],lx=hx*M[0]+hy*M[1]+hz*M[2],ly=hx*M[4]+hy*M[5]+hz*M[6];
 return{t,u:lx/p.w+.5,v:.5-ly/p.h}}

async function enter(mode){
 if(XR.sess||!navigator.xr||!R3.ready)return;
 let s;
 try{s=await navigator.xr.requestSession(mode,{optionalFeatures:['local-floor','hand-tracking']})}catch(e){console.error(e);const m=$('m');if(m)m.textContent='Could not start '+(mode=='immersive-ar'?'MR':'VR')+': '+(e.message||e);return}
 try{
  if(gl.makeXRCompatible){try{await gl.makeXRCompatible()}catch(e){console.warn('makeXRCompatible:',e&&e.message)}}
  XR.layer=new XRWebGLLayer(s,gl,{alpha:true,antialias:true,depth:true,stencil:false});
  s.updateRenderState({baseLayer:XR.layer,depthNear:.02,depthFar:30});
  try{XR.ref=await s.requestReferenceSpace('local-floor');XR.floor=true}catch(e){XR.ref=await s.requestReferenceSpace('local');XR.floor=false}
 }catch(e){console.error(e);try{s.end()}catch(_){}return}
 XR.sess=s;XR.mode=mode;XR.board.scale=1.5;XR.placed=false;XR.grab=null;XR.menuPos=null;XR.lastT=0;R3.xr=true;
 if(!XR.menuP){XR.menuP=mkPanel(1024,1024,1.0,1.0);XR.hudP=mkPanel(1280,320,.9,.225)}
 if(st=='play')pause();
 s.addEventListener('end',onEnd);

 s.addEventListener('selectstart',e=>uiClick(e.inputSource));
 if(XR.ref.addEventListener)XR.ref.addEventListener('reset',()=>{XR.placed=false});
 s.requestAnimationFrame(onXR);
}
function onEnd(){XR.sess=null;XR.ref=null;R3.xr=false;if(gl)gl.bindFramebuffer(gl.FRAMEBUFFER,null);if(st=='play')pause();setView(view3d);kick()}
function uiClick(src){const h=XR.hover.get(src);if(!h||h.idx<0)return;const b=h.p.btns[h.idx];if(b&&!b.dim){try{b.fn()}catch(e){console.error(e)}h.p.dirty=true;R3.haptic(18,src)}}

function onXR(t,frame){
 const s=XR.sess;if(!s)return;s.requestAnimationFrame(onXR);
 step(t);
 const pose=frame.getViewerPose(XR.ref);if(!pose)return;
 const hp=pose.transform.position,head=[hp.x,hp.y,hp.z],dt=XR.lastT?clamp((t-XR.lastT)/1000,0,.1):.016;XR.lastT=t;XR.n++;
 if(!XR.placed)place(pose);
 const menuOn=st!='play',vr=XR.mode==='immersive-vr',floor=XR.floor;
 /* ---- input */
 const rays=[];
 for(const src of s.inputSources){let q=XR.btn.get(src);if(!q){q={a:0,b:0,g:0,latch:null};XR.btn.set(src,q)}
  const gp=src.gamepad;
  if(gp){const ax=gp.axes,bt=gp.buttons,sx=ax.length>=4?ax[2]:ax[0]||0,sy=ax.length>=4?ax[3]:ax[1]||0;
   const mag=Math.hypot(sx,sy);if(mag<.3)q.latch=null;
   else if(mag>.62&&st=='play'){const bx=XR.board.pos[0]-head[0],bz=XR.board.pos[2]-head[2],l=Math.hypot(bx,bz)||1,ax_=bx/l,az=bz/l,rx=-az,rz=ax_,u=sx,v=-sy,wx=u*rx+v*ax_,wz=u*rz+v*az,c=Math.cos(XR.board.yaw),sn=Math.sin(XR.board.yaw),lx=c*wx-sn*wz,lz=sn*wx+c*wz;
    let dx=0,dy=0;if(Math.abs(lx)>Math.abs(lz))dx=Math.sign(lx);else dy=Math.sign(lz);const key=dx+','+dy;if(key!==q.latch){q.latch=key;turn(dx,dy)}}
   const A=bt[4]&&bt[4].pressed,B=bt[5]&&bt[5].pressed,G=bt[1]&&bt[1].pressed;
   if(A&&!q.a){if(st=='play')pause();else act()}
   if(B&&!q.b&&st=='play')pause();
   if(G&&!q.g){const gpz=frame.getPose(src.gripSpace||src.targetRaySpace,XR.ref);if(gpz){const p=gpz.transform.position,m=gpz.transform.matrix;XR.grab={src,p0:[p.x,p.y,p.z],y0:Math.atan2(m[8],m[10]),bp:XR.board.pos.slice(),by:XR.board.yaw}}}
   if(!G&&q.g&&XR.grab&&XR.grab.src===src)XR.grab=null;
   q.a=A;q.b=B;q.g=G}
  if(XR.grab&&XR.grab.src===src){const gpz=frame.getPose(src.gripSpace||src.targetRaySpace,XR.ref);if(gpz){const p=gpz.transform.position,m=gpz.transform.matrix,g=XR.grab;
   XR.board.pos=[g.bp[0]+p.x-g.p0[0],g.bp[1]+p.y-g.p0[1],g.bp[2]+p.z-g.p0[2]];XR.board.yaw=g.by+angd(g.y0,Math.atan2(m[8],m[10]))}}
  if(src.targetRaySpace){const rp=frame.getPose(src.targetRaySpace,XR.ref);if(rp){const p=rp.transform.position,m=rp.transform.matrix;rays.push({src,o:[p.x,p.y,p.z],d:[-m[8],-m[9],-m[10]]})}}}
 /* ---- panels */
 const bmN=boardM();
 const far=m4.xf(bmN,[0,0,-BH/2-.03]);
 if(menuOn&&(!XR.menuPos||!XR.menuWas)){const bx=XR.board.pos[0]-head[0],bz=XR.board.pos[2]-head[2],l=Math.hypot(bx,bz)||1;const dd=l+.35+.3*XR.board.scale;XR.menuPos=[head[0]+bx/l*dd,head[1]+.06,head[2]+bz/l*dd]}
 XR.menuWas=menuOn;
 const mp=XR.menuP,hd=XR.hudP;mp.vis=menuOn;hd.vis=!menuOn;
 if(menuOn){mp.M=billboard(XR.menuPos,head,-.12);if(XR.n%4==0){const sg=menuSig()+'|'+mp.hover;if(sg!==XR.menuSig){XR.menuSig=sg;mp.dirty=true}}if(mp.dirty){drawMenu(mp);upTex(mp)}}
 else{hd.M=billboard([far[0],far[1]+.17,far[2]],head,-.45);const sg=$('sc').textContent+'|'+$('lv').textContent+'|'+$('bs').textContent+'|'+Math.ceil(fx.slow/1000)+Math.ceil(fx.x2/1000)+Math.ceil(fx.ghost/1000);if(sg!==XR.hudSig||hd.dirty){XR.hudSig=sg;drawHUD(hd);upTex(hd)}}
 /* ---- pointer rays vs menu */
 XR.hover.clear();let anyHover=-1;
 for(const r of rays){let best=null;if(menuOn){const h=hit(r.o,r.d,mp);if(h&&h.u>=0&&h.u<=1&&h.v>=0&&h.v<=1){const px=h.u*mp.wPx,py=h.v*mp.hPx;let idx=-1;for(let i=mp.btns.length-1;i>=0;i--){const b=mp.btns[i];if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h){idx=i;break}}best={p:mp,idx,t:h.t}}}
  r.best=best;XR.hover.set(r.src,best||{p:mp,idx:-1});if(best&&best.idx>=0)anyHover=best.idx}
 if(menuOn&&anyHover!==mp.hover){mp.hover=anyHover;mp.dirty=true;XR.menuSig=''}
 /* ---- scene */
 Wsph.clear();Wbox.clear();build(t/1000,dt);Wsph.clear();Wbox.clear();
 if(vr&&floor){Wbox.add(0,-.011,0,6,.02,6,mixc(C('--bg'),[0,0,0],.45),0,0,.05);const lc=mixc(C('--bg'),C('--accent'),.4);for(let i=-6;i<=6;i++){const o=i*.5;Wbox.add(o,-.0005,0,.006,.002,6,lc,0,.3,0);Wbox.add(0,-.0005,o,6,.002,.006,lc,0,.3,0)}}
 for(const r of rays){if(!menuOn&&!vr)continue;const len=menuOn&&r.best?r.best.t:(menuOn?.7:.15);
  const n=menuOn?14:5;for(let i=1;i<=n;i++){const k=len*i/n;Wsph.add(r.o[0]+r.d[0]*k,r.o[1]+r.d[1]*k,r.o[2]+r.d[2]*k,.0032,.0032,.0032,r.best&&r.best.idx>=0?[1,1,1]:[.7,.9,1],0,.9,0)}
  if(menuOn&&r.best)Wsph.add(r.o[0]+r.d[0]*r.best.t,r.o[1]+r.d[1]*r.best.t,r.o[2]+r.d[2]*r.best.t,.007,.007,.007,[1,1,1],0,1,0)}
 upScene();
 /* ---- draw both eyes */
 const bl=XR.layer;gl.bindFramebuffer(gl.FRAMEBUFFER,bl.framebuffer);
 if(vr){const b=mixc(C('--bg'),[0,0,0],.62);gl.clearColor(b[0],b[1],b[2],1)}else gl.clearColor(0,0,0,0);
 gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 for(const view of pose.views){const vp=bl.getViewport(view);gl.viewport(vp.x,vp.y,vp.width,vp.height);
  const VP=m4.mul(view.projectionMatrix,view.transform.inverse.matrix),cp=view.transform.position,cam=[cp.x,cp.y,cp.z];
  drawScene(VP,cam,bmN);drawWorld(VP,cam);drawLabel(VP,cam,bmN);drawPanels(VP,cam,[mp,hd])}
}

/* ------------------------------------------------------------------ boot */
function boot(){
 try{initGL();initLabels();R3.ready=true}catch(e){console.warn('3D unavailable:',e);R3.ready=false}
 const vb=document.getElementById('vwb');
 if(!R3.ready){if(vb)vb.closest('.orow').classList.add('hide');return}
 cvGL.addEventListener('webglcontextlost',e=>{e.preventDefault();R3.ready=false;R3.on=false;cv.style.display='';cvGL.style.display='none'});
 if(vb)vb.onclick=()=>{view3d=!R3.on;setView(view3d,true)};
 setView(view3d);
 /* XR entry buttons: pure feature detection (no user-agent sniffing).  Headset browsers offer immersive-vr;
    an AR-only device (a phone, no controllers) only gets the buttons when the address carries ?xr */
 if(navigator.xr&&navigator.xr.isSessionSupported){
  const force=/[?&]xr(=1)?(&|$)/.test(location.search);
  const probe=m=>{try{return navigator.xr.isSessionSupported(m).catch(()=>false)}catch(e){return Promise.resolve(false)}};
  Promise.all([probe('immersive-ar'),probe('immersive-vr')]).then(([a,v])=>{const row=document.getElementById('xrrow');if(!row||!(v||(a&&force)))return;row.hidden=false;
   const ba=document.getElementById('xrar'),bv=document.getElementById('xrvr');if(a)ba.hidden=false;if(v)bv.hidden=false;
   ba.onclick=()=>enter('immersive-ar');bv.onclick=()=>enter('immersive-vr')})}
}
boot();
})();
